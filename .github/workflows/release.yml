name: Release

# Push v<VERSION> or release/v<VERSION>. The branch path creates the tag after verification.
# Each architecture is built and verified on a native runner. A separate job, which is the only
# one with write access and the signing secret, signs SHA256SUMS and publishes the GitHub release.
on:
  push:
    tags: ['v*']
    branches: ['release/v*']

permissions:
  contents: read

jobs:
  build:
    name: Build and verify (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/WorkSpace/browsers
      MDPREVIEW_DISABLE_UPDATES: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Release ref must match VERSION
        run: |
          TAG="v$(cat VERSION)"
          case "$GITHUB_REF" in
            "refs/tags/$TAG"|"refs/heads/release/$TAG") ;;
            *) echo "Ref $GITHUB_REF does not match release version $TAG"; exit 1 ;;
          esac

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements/lock.txt
          npm ci --ignore-scripts
          npx playwright install chromium webkit

      - name: Static and supply-chain checks
        run: |
          .venv/bin/ruff check mdpreview_core scripts mdPreview.py --select F821,E9
          node scripts/vendor.mjs --check
          node scripts/extract-i18n.mjs --check
          npm audit --audit-level=high

      - name: Tests
        run: |
          npm test
          scripts/retry.sh 2 .venv/bin/python scripts/test-python.py
          npm run test:e2e

      - name: Large-document performance and accessibility (WebKit)
        if: matrix.arch == 'arm64'
        run: >
          node node_modules/@playwright/test/cli.js test
          --config=tests/release-playwright.config.js --project=webkit
          --grep-invert "原生冷启动"

      - name: Build app and disk image
        run: scripts/build_dmg.sh

      - name: Build must be a single native architecture
        run: |
          APP="$PWD/WorkSpace/dist/release-$(cat VERSION)/mdPreview.app"
          test "$(lipo -archs "$APP/Contents/MacOS/mdPreview")" = "${{ matrix.arch }}"
          codesign --verify --deep --strict "$APP"

      - name: Native acceptance on this architecture
        run: |
          APP="$PWD/WorkSpace/dist/release-$(cat VERSION)/mdPreview.app"
          scripts/retry.sh 3 .venv/bin/python scripts/verify-headless.py --app "$APP"
          scripts/retry.sh 3 .venv/bin/python scripts/verify-update-e2e.py --app "$APP"
          scripts/retry.sh 3 .venv/bin/python scripts/verify-update-live.py --app "$APP"

      - name: Keep native-test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ matrix.arch }}
          path: WorkSpace/native-verification/**
          if-no-files-found: ignore

      - name: Package
        run: |
          VERSION="$(cat VERSION)"
          DIST="$PWD/WorkSpace/dist/release-$VERSION"
          mkdir -p out
          .venv/bin/python scripts/package-release.py --app "$DIST/mdPreview.app" --out out
          cp "$DIST/mdPreview-$VERSION-${{ matrix.arch }}.dmg" out/
          # Releases up to 1.5.0 (arm64 only) look for an asset named mdPreview.dmg.
          if [ "${{ matrix.arch }}" = arm64 ]; then cp "$DIST/mdPreview.dmg" out/; fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Both architectures must be present
        run: |
          VERSION="$(cat VERSION)"
          for arch in arm64 x86_64; do
            for kind in zip dmg; do test -f "dist/mdPreview-$VERSION-$arch.$kind" || { echo "missing $arch $kind"; exit 1; }
            done
          done
          ls -la dist

      - name: Sign the checksum list
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          test -n "$RELEASE_SIGNING_KEY" || { echo "secret RELEASE_SIGNING_KEY is not configured"; exit 1; }
          umask 077
          KEY="$RUNNER_TEMP/release-key.pem"
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$KEY"
          node scripts/sign-release.mjs dist "$KEY"
          rm -f "$KEY"
          # Defence in depth: the signature must verify against the key published in the repository.
          openssl dgst -sha256 -verify scripts/release-pubkey.pem -signature dist/SHA256SUMS.sig dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Release notes from CHANGELOG
        run: python3 scripts/prepare-release.py notes --version "$(cat VERSION)" > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          if [[ "$GITHUB_REF" == "refs/heads/release/$TAG" ]]; then
            ENDPOINT="repos/$GITHUB_REPOSITORY/git/refs"
            if TAG_SHA="$(gh api "$ENDPOINT/tags/$TAG" --jq '.object.sha')"; then
              test "$TAG_SHA" = "$GITHUB_SHA" || { echo "Tag $TAG points to a different commit"; exit 1; }
            else
              gh api --method POST "$ENDPOINT" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
            fi
          fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "mdPreview $(cat VERSION)" \
            --notes-file release-notes.md

      - name: Check out the Homebrew tap
        if: env.TAP_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: tahoeliu/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update the Homebrew cask
        if: env.TAP_TOKEN != ''
        run: |
          python3 scripts/prepare-release.py cask --sums dist/SHA256SUMS --out tap/Casks/mdpreview.rb --version "$(cat VERSION)"
          cd tap
          git config user.name "mdPreview release bot"
          git config user.email "actions@users.noreply.github.com"
          git add Casks/mdpreview.rb
          git diff --cached --quiet || git commit -m "mdpreview $(cat ../VERSION)"
          git push
