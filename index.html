<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<button class="toc-toggle collapsed" id="tocToggle" title="Show outline" aria-label="Show outline" aria-expanded="false">
  <span class="toc-toggle-icon" aria-hidden="true"></span>
</button>
<nav class="toc-sidebar hidden" id="tocSidebar" aria-label="Document outline"></nav>

<!-- Find Bar -->
<div class="find-bar" id="findBar">
  <input type="text" id="findInput" placeholder="Find" autocomplete="off" spellcheck="false" />
  <span class="find-count" id="findCount"></span>
  <button id="findPrev" title="Previous (Shift+Cmd+G)">&#x25B2;</button>
  <button id="findNext" title="Next (Cmd+G)">&#x25BC;</button>
  <button class="find-close" id="findClose" title="Close (Esc)">&#x2715;</button>
</div>

<div class="scroll-wrap">
  <div class="page" id="page">
    <div class="markdown" id="content" contenteditable="true" spellcheck="false"></div>
    <div class="source" id="source">
      <pre class="highlight-layer" id="highlightLayer" aria-hidden="true"></pre>
      <textarea id="textarea" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<div class="mode-indicator" id="modeIndicator"></div>
<div class="status" id="status"></div>
<div class="edit-hint-bubble" id="editHintBubble" role="status" aria-live="polite"></div>
<div class="edit-hint-bubble size-hint-bubble" id="sizeHintBubble" role="status" aria-live="polite"></div>
<div class="update-bubble" id="updateBubble" onclick="installUpdate()" role="alert">
  <div class="update-bubble-body">
    <span class="update-bubble-text">Update available, click to install...</span>
    <div class="update-progress" aria-hidden="true"><div class="update-progress-bar" id="updateProgressBar"></div></div>
  </div>
  <button class="update-bubble-close" onclick="dismissUpdateBubble(event)" title="Dismiss" aria-label="Dismiss">&times;</button>
</div>
<div class="image-lightbox" id="imageLightbox" role="dialog" aria-modal="true" aria-label="Image preview" aria-hidden="true" tabindex="-1">
  <header class="image-lightbox-header">
    <span id="imageLightboxTitle">Image preview</span>
    <button type="button" id="imageClose" class="image-icon-button" aria-label="Close" title="Close (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
  </header>
  <div class="image-stage" id="imageStage">
    <img id="imageLightboxImg" alt="" draggable="false">
    <div id="imageLightboxVector" class="image-vector" aria-label="Diagram preview"></div>
    <span id="imageLoadStatus" class="image-load-status" role="status"></span>
  </div>
  <footer class="image-lightbox-footer">
    <div class="image-toolbar" role="group" aria-label="Image zoom">
      <button type="button" id="imageZoomOut" class="image-icon-button" aria-label="Zoom out" title="Zoom out (−)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
      <output id="imageZoomValue" aria-label="Zoom relative to actual image size">100%</output>
      <button type="button" id="imageZoomIn" class="image-icon-button" aria-label="Zoom in" title="Zoom in (+)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12M12 6v12"/></svg></button>
      <span class="image-toolbar-divider" aria-hidden="true"></span>
      <button type="button" id="imageFit" class="image-text-button">Fit</button>
      <button type="button" id="imageActual" class="image-text-button" title="Actual size (1)">1:1</button>
    </div>
    <span id="imageZoomHint" class="image-zoom-hint">Scroll or pinch to zoom · Drag to move</span>
  </footer>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-header" id="modalHeader">File Properties</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions">
      <button class="modal-close" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script src="marked.min.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
