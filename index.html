<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mdPreview</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/content.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/print.css">
</head>
<body>

<button class="toc-toggle collapsed" id="tocToggle" title="Show outline" aria-label="Show outline" aria-expanded="false">
  <span class="toc-toggle-icon" aria-hidden="true"></span>
</button>
<nav class="toc-sidebar hidden" id="tocSidebar" aria-label="Document outline"></nav>

<!-- Find Bar -->
<div class="find-bar" id="findBar">
  <input type="text" id="findInput" aria-label="Find" placeholder="Find" autocomplete="off" spellcheck="false" />
  <span class="find-count" id="findCount" role="status"></span>
  <button id="findPrev" title="Previous (Shift+Cmd+G)">&#x25B2;</button>
  <button id="findNext" title="Next (Cmd+G)">&#x25BC;</button>
  <button class="find-close" id="findClose" title="Close (Esc)">&#x2715;</button>
</div>

<div class="scroll-wrap" tabindex="0">
  <div class="page" id="page">
    <div aria-label="Markdown document" class="markdown" id="content" contenteditable="true" spellcheck="false"></div>
    <div class="source" id="source">
      <pre class="highlight-layer" id="highlightLayer" aria-hidden="true"></pre>
      <textarea aria-label="Markdown source" id="textarea" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<div class="mode-indicator" id="modeIndicator"></div>
<div role="status" aria-live="polite" class="status" id="status"></div>
<div class="edit-hint-bubble" id="editHintBubble" role="status" aria-live="polite"></div>
<div class="edit-hint-bubble size-hint-bubble" id="sizeHintBubble" role="status" aria-live="polite"></div>
<div class="update-bubble" id="updateBubble" role="alert">
  <div class="update-bubble-body">
    <span class="update-bubble-text">Update available, click to install...</span>
    <div class="update-progress" aria-hidden="true"><div class="update-progress-bar" id="updateProgressBar"></div></div>
  </div>
  <button class="update-bubble-close" title="Dismiss" aria-label="Dismiss">&times;</button>
</div>
<div class="image-lightbox" id="imageLightbox" role="dialog" aria-modal="true" aria-labelledby="imageViewerTitle" aria-describedby="imageViewerHelp" aria-hidden="true">
  <div class="image-viewer-toolbar">
    <span id="imageViewerTitle">Image preview</span>
    <div class="image-viewer-controls">
      <button type="button" data-viewer="out" aria-label="Zoom out">−</button>
      <output class="image-viewer-scale" aria-label="Zoom level">100%</output>
      <button type="button" data-viewer="in" aria-label="Zoom in">+</button>
      <button type="button" data-viewer="fit">Fit</button>
      <button type="button" data-viewer="actual">100%</button>
      <button type="button" data-viewer="close">Close</button>
    </div>
  </div>
  <div class="image-viewer-stage"><div class="image-viewer-surface"></div></div>
  <div class="image-viewer-help" id="imageViewerHelp">Scroll to zoom · Drag to pan · Esc to close</div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalHeader">
    <div class="modal-header" id="modalHeader">File Properties</div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions">
      <button class="modal-close">Close</button>
    </div>
  </div>
</div>

<script src="frontend/headless.js"></script>
<script src="vendor/marked.min.js" defer></script>
<script src="vendor/purify.min.js" defer></script>
<script src="vendor/marked-footnote.umd.js" defer></script>
<script src="frontend/document-session.js" defer></script>
<script src="frontend/markdown-pipeline.js" defer></script>
<script src="frontend/image-viewer.js" defer></script>
<script src="frontend/bridge.js" defer></script>
<script src="frontend/i18n.js" defer></script>
<script src="frontend/output/prepare.js" defer></script>
<script src="frontend/output/plaintext.js" defer></script>
<script src="frontend/performance.js" defer></script>
<script src="frontend/math.js" defer></script>
<script src="frontend/output/raster.js" defer></script>
<script src="frontend/output/docx.js" defer></script>
<script src="frontend/output/richtext.js" defer></script>
<script src="frontend/reading.js" defer></script>
<script src="frontend/reading-progress.js" defer></script>
<script src="frontend/goto.js" defer></script>
<script src="frontend/format-toolbar.js" defer></script>
<script src="frontend/settings.js" defer></script>
<script src="frontend/editor.js" defer></script>
<script src="frontend/onboarding.js" defer></script>
<script src="frontend/syntax.js" defer></script>
<script src="frontend/tables.js" defer></script>
<script src="frontend/updates.js" defer></script>
<script src="frontend/find.js" defer></script>
<script src="frontend/paste.js" defer></script>
<script src="frontend/outline.js" defer></script>
<script src="frontend/output.js" defer></script>
<script src="frontend/rendered-editing.js" defer></script>
<script src="frontend/conversion.js" defer></script>
<script src="frontend/rendering.js" defer></script>
<script src="frontend/feedback.js" defer></script>
<script src="frontend/save-dialogs.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
