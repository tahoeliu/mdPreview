<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<button class="toc-toggle collapsed" id="tocToggle" title="Show outline" aria-label="Show outline" aria-expanded="false">
  <span class="toc-toggle-icon" aria-hidden="true"></span>
</button>
<nav class="toc-sidebar hidden" id="tocSidebar" aria-label="Document outline"></nav>

<!-- Find Bar -->
<div class="find-bar" id="findBar">
  <input type="text" id="findInput" placeholder="Find" autocomplete="off" spellcheck="false" />
  <span class="find-count" id="findCount"></span>
  <button id="findPrev" title="Previous (Shift+Cmd+G)">&#x25B2;</button>
  <button id="findNext" title="Next (Cmd+G)">&#x25BC;</button>
  <button class="find-close" id="findClose" title="Close (Esc)">&#x2715;</button>
</div>

<div class="scroll-wrap">
  <div class="page" id="page">
    <div class="markdown" id="content" contenteditable="true" spellcheck="false"></div>
    <div class="source" id="source">
      <pre class="highlight-layer" id="highlightLayer" aria-hidden="true"></pre>
      <textarea id="textarea" spellcheck="false"></textarea>
    </div>
  </div>
</div>

<div class="source-hint" id="sourceHint"></div>
<div class="status" id="status"></div>
<div class="image-lightbox" id="imageLightbox"><img id="imageLightboxImg" alt="Preview"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-header">File Properties</div>
    <div class="modal-body" id="modalBody"></div>
    <button class="modal-close" onclick="closeModal()">Close</button>
  </div>
</div>

<script src="marked.min.js"></script>
<script src="turndown.js"></script>
<script src="mermaid.min.js"></script>
<script src="app.js"></script>
</body>
</html>
